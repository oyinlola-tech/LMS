<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Grades - LearnBridge</title>
  <link href="/css/styles.css" rel="stylesheet"/>
  <link href="/css/modal.css" rel="stylesheet"/>
</head>
<body>
  <div data-include="/students/components/dashboard-sidebar"></div>
  <main class="admin-main">
    <div data-include="/students/components/dashboard-header"></div>
    <div class="container" style="padding-top:1rem;padding-bottom:1rem">
      <h1 style="font-size:1.5rem;font-weight:700;margin-bottom:1.5rem">Grades</h1>
      <div id="grades-content">
        <p style="color:var(--on-surface-variant)">Loading grades...</p>
      </div>
    </div>
  </main>
  <div data-include="/students/components/dashboard-bottom-nav"></div>
  <script src="/js/components/include.js"></script>
  <script src="/js/shared/api.js"></script>
  <script src="/js/shared/auth.js"></script>
  <script src="/js/shared/dom.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var container = document.getElementById('grades-content');
      container.innerHTML = '<div class="card" style="padding:2rem;text-align:center;color:var(--on-surface-variant)"><span class="material-symbols-outlined icon" style="font-size:3rem;margin-bottom:1rem;display:block">grading</span><p>Your grades will appear here.</p></div>';
    });
  </script>
</body>
</html>
