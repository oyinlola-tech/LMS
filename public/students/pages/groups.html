<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>LearnBridge - Groups</title>
  <link href="/css/styles.css" rel="stylesheet"/>
  <link href="/css/modal.css" rel="stylesheet"/>
  <style>
    body { background: var(--surface); }
    .layout { display: flex; min-height: 100vh; }
    .main { flex: 1; padding: 2rem; max-width: 900px; margin: 0 auto; width: 100%; }
    .tabs { display: flex; gap: 0; margin-bottom: 1.5rem; border-bottom: 1px solid var(--outline-variant); }
    .tabs button { padding: 0.75rem 1.5rem; border: none; background: none; font-size: 0.875rem; font-weight: 600; color: var(--on-surface-variant); cursor: pointer; border-bottom: 2px solid transparent; font-family: inherit; }
    .tabs button.active { color: var(--primary); border-bottom-color: var(--primary); }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.5rem; }
    .subtitle { font-size: 0.875rem; color: var(--on-surface-variant); margin: -1rem 0 1.5rem; }
    .group-card { padding: 1.25rem; border-radius: 1rem; background: var(--surface-container); border: 1px solid var(--outline-variant); margin-bottom: 0.75rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    .group-card .info { flex: 1; min-width: 0; }
    .group-card .info h3 { margin: 0 0 0.25rem; font-size: 1rem; }
    .group-card .info p { margin: 0; font-size: 0.8125rem; color: var(--on-surface-variant); }
    .group-card .info .meta { font-size: 0.75rem; color: var(--on-surface-variant); margin-top: 0.375rem; }
    .group-card .actions { display: flex; gap: 0.5rem; align-items: center; flex-shrink: 0; }
    .btn-sm { padding: 0.375rem 0.75rem; border-radius: 0.5rem; border: none; font-size: 0.75rem; font-weight: 600; cursor: pointer; font-family: inherit; }
    .btn-sm.primary { background: var(--primary); color: var(--on-primary); }
    .btn-sm.secondary { background: var(--surface-variant); color: var(--on-surface-variant); }
    .btn-sm.success { background: #059669; color: #fff; }
    .btn-sm.danger { background: var(--error); color: #fff; }
    .btn-sm.outline { background: none; border: 1px solid var(--outline); color: var(--on-surface-variant); }
    .inline-form { background: var(--surface-container); border: 1px solid var(--outline-variant); border-radius: 1rem; padding: 1.25rem; margin-bottom: 1rem; }
    .inline-form h3 { margin: 0 0 1rem; font-size: 1rem; }
    .inline-form label { display: block; font-size: 0.8125rem; font-weight: 600; margin-bottom: 0.25rem; color: var(--on-surface-variant); }
    .inline-form input, .inline-form textarea { width: 100%; padding: 0.5rem 0.75rem; border: 1px solid var(--outline); border-radius: 0.5rem; font-size: 0.875rem; background: var(--surface); color: var(--on-surface); margin-bottom: 0.75rem; box-sizing: border-box; font-family: inherit; }
    .inline-form textarea { resize: vertical; min-height: 60px; }
    .inline-form .form-actions { display: flex; gap: 0.5rem; justify-content: flex-end; }
    .empty-state { text-align: center; padding: 4rem 1rem; color: var(--on-surface-variant); }
    .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; display: block; }
    @media (max-width: 768px) { .sidebar { display: none; } .main { padding: 1rem; } .group-card { flex-direction: column; align-items: stretch; } .group-card .actions { justify-content: flex-end; } }
  </style>
</head>
<body>
  <div class="layout">
    <div data-include="/students/components/dashboard-sidebar"></div>
    <main class="main">
      <h1>Discussion Groups</h1>
      <p class="subtitle">Find and join study groups, or create your own</p>

      <div class="toolbar">
        <div class="tabs">
          <button class="active" onclick="switchTab('mine')">My Groups</button>
          <button onclick="switchTab('all')">All Groups</button>
        </div>
        <button class="btn-sm primary" onclick="showCreateForm()">+ Create Group</button>
      </div>

      <div id="create-form" class="inline-form" style="display:none">
        <h3>Create New Group</h3>
        <label for="create-name">Group Name</label>
        <input id="create-name" type="text" placeholder="Enter group name"/>
        <label for="create-desc">Description</label>
        <textarea id="create-desc" placeholder="What's this group about?"></textarea>
        <div class="form-actions">
          <button class="btn-sm outline" onclick="hideCreateForm()">Cancel</button>
          <button class="btn-sm success" onclick="createGroup()">Create</button>
        </div>
      </div>

      <div id="edit-form" class="inline-form" style="display:none">
        <h3>Edit Group</h3>
        <label for="edit-name">Group Name</label>
        <input id="edit-name" type="text"/>
        <label for="edit-desc">Description</label>
        <textarea id="edit-desc"></textarea>
        <div class="form-actions">
          <button class="btn-sm outline" onclick="hideEditForm()">Cancel</button>
          <button class="btn-sm success" onclick="saveEdit()">Save</button>
        </div>
      </div>

      <div id="groups-list"><p style="color:var(--on-surface-variant);text-align:center;padding:2rem">Loading groups...</p></div>
    </main>
  </div>
  <div data-include="/students/components/dashboard-bottom-nav"></div>
  <div data-include="auth-modal"></div>
  <script src="/js/components/include.js"></script>
  <script src="/js/shared/api.js"></script>
  <script src="/js/shared/auth.js"></script>
  <script src="/js/shared/dom.js"></script>
  <script src="/js/components/auth-modal.js"></script>
  <script src="/js/components/active-page.js"></script>
  <script>
    (function() {
      if (!localStorage.getItem('token')) { window.location.href = '/login'; return; }
      var currentTab = 'mine';
      var editGroupId = null;

      document.addEventListener('components-loaded', function() { loadGroups(); });

      function escapeHtml(t) { if (typeof t !== 'string') return ''; return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

      function getUserId() { try { return JSON.parse(atob(localStorage.getItem('token').split('.')[1])).sub; } catch(e) { return null; } }

      window.switchTab = function(tab) {
        currentTab = tab;
        document.querySelectorAll('.tabs button').forEach(function(b) {
          var txt = (b.textContent || '').trim().toLowerCase();
          b.classList.toggle('active', (tab === 'mine' && txt.indexOf('my') !== -1) || (tab === 'all' && txt.indexOf('all') !== -1));
        });
        loadGroups();
      };

      function loadGroups() {
        var endpoint = currentTab === 'mine' ? '/api/groups/mine' : '/api/groups/';
        hideCreateForm();
        hideEditForm();
        api.get(endpoint).then(function(res) {
          var el = document.getElementById('groups-list');
          var data = res && res.data ? res.data : (Array.isArray(res) ? res : []);
          if (!data || !data.length) {
            el.innerHTML = '<div class="empty-state"><span class="icon material-symbols-outlined">group</span><p>No groups found' + (currentTab === 'mine' ? '. Join some groups or create one!' : '.') + '</p></div>';
            return;
          }
          var userId = getUserId();
          el.innerHTML = data.map(function(g) {
            var isCreator = g.creatorId === userId;
            var isMember = g.isMember;
            return '<div class="group-card">' +
              '<div class="info"><h3>' + escapeHtml(g.name) + '</h3>' +
              '<p>' + escapeHtml(g.description || 'No description') + '</p>' +
              '<div class="meta">' + (g.memberCount || 0) + ' member' + ((g.memberCount || 0) !== 1 ? 's' : '') + ' &middot; Created by ' + escapeHtml(g.creatorName || 'Unknown') + '</div></div>' +
              '<div class="actions">' +
              (isCreator ? '<button class="btn-sm outline" onclick="showEditForm(\'' + g.id + '\',\'' + escapeHtml(g.name || '').replace(/'/g,"\\'") + '\',\'' + escapeHtml(g.description || '').replace(/'/g,"\\'") + '\')">Edit</button><button class="btn-sm danger" onclick="deleteGroup(\'' + g.id + '\')">Delete</button>' : '') +
              (!isCreator && isMember ? '<button class="btn-sm secondary" onclick="leaveGroup(\'' + g.id + '\')">Leave</button>' : '') +
              (!isMember && !isCreator ? '<button class="btn-sm success" onclick="joinGroup(\'' + g.id + '\')">Join</button>' : '') +
              '</div></div>';
          }).join('');
        }).catch(function() {
          document.getElementById('groups-list').innerHTML = '<div class="empty-state" style="color:var(--error)"><span class="icon material-symbols-outlined">error</span><p>Failed to load groups</p></div>';
        });
      }

      window.showCreateForm = function() {
        hideEditForm();
        document.getElementById('create-form').style.display = 'block';
        document.getElementById('create-name').value = '';
        document.getElementById('create-desc').value = '';
        document.getElementById('create-name').focus();
      };

      window.hideCreateForm = function() { document.getElementById('create-form').style.display = 'none'; };

      window.createGroup = function() {
        var name = document.getElementById('create-name').value.trim();
        var description = document.getElementById('create-desc').value.trim();
        if (!name) { alert('Please enter a group name.'); return; }
        api.post('/api/groups/', { name: name, description: description }).then(function() {
          hideCreateForm();
          loadGroups();
        }).catch(function(err) { alert((err && err.error && err.error.message) || 'Failed to create group'); });
      };

      window.showEditForm = function(id, name, description) {
        hideCreateForm();
        editGroupId = id;
        document.getElementById('edit-form').style.display = 'block';
        document.getElementById('edit-name').value = name;
        document.getElementById('edit-desc').value = description;
        document.getElementById('edit-name').focus();
      };

      window.hideEditForm = function() { document.getElementById('edit-form').style.display = 'none'; editGroupId = null; };

      window.saveEdit = function() {
        if (!editGroupId) return;
        var name = document.getElementById('edit-name').value.trim();
        var description = document.getElementById('edit-desc').value.trim();
        if (!name) { alert('Please enter a group name.'); return; }
        api.put('/api/groups/' + editGroupId, { name: name, description: description }).then(function() {
          hideEditForm();
          loadGroups();
        }).catch(function(err) { alert((err && err.error && err.error.message) || 'Failed to update group'); });
      };

      window.deleteGroup = function(id) {
        if (!confirm('Delete this group permanently?')) return;
        api.del('/api/groups/' + id).then(function() { loadGroups(); }).catch(function(err) { alert((err && err.error && err.error.message) || 'Failed to delete group'); });
      };

      window.joinGroup = function(id) {
        api.post('/api/groups/' + id + '/join').then(function() { loadGroups(); }).catch(function(err) { alert((err && err.error && err.error.message) || 'Failed to join group'); });
      };

      window.leaveGroup = function(id) {
        api.post('/api/groups/' + id + '/leave').then(function() { loadGroups(); }).catch(function(err) { alert((err && err.error && err.error.message) || 'Failed to leave group'); });
      };
    })();
  </script>
</body>
</html>
