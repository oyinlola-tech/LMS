<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Page Not Found - LearnBridge</title>
  <link href="/css/styles.css" rel="stylesheet"/>
  <link href="/css/workspace.css" rel="stylesheet"/>
</head>
<body>
  <main class="workspace-shell" style="display:grid;place-items:center;padding:2rem">
    <section class="workspace-panel workspace-section" style="max-width:680px;text-align:center">
      <p class="workspace-kicker">404</p>
      <h1 class="workspace-title" style="font-size:clamp(2.25rem,7vw,5rem)">This page is not available.</h1>
      <p class="workspace-summary" style="margin-left:auto;margin-right:auto">The route may have moved, or the link may be incomplete. Return to a dashboard or search the catalog.</p>
      <div class="workspace-actions" style="justify-content:center;margin-top:1.5rem">
        <a class="btn-primary" href="/dashboard">Go to dashboard</a>
        <a class="btn-secondary" href="/courses">Browse courses</a>
      </div>
    </section>
  </main>
</body>
</html>
