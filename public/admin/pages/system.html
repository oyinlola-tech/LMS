<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>System - Admin | LearnBridge</title>
  <link href="/css/styles.css" rel="stylesheet"/>
  <link href="/css/modal.css" rel="stylesheet"/>
</head>
<body>
  <div data-include="/admin/components/admin-sidebar"></div>
  <main class="admin-main">
    <div data-include="/admin/components/admin-header"></div>
    <div class="container" style="padding-top:1rem;padding-bottom:1rem;max-width:600px">
      <h1 style="font-size:1.5rem;font-weight:700;margin-bottom:1.5rem">System Configuration</h1>
      <div class="card" style="padding:1.5rem">
        <p style="margin-bottom:1rem;color:var(--on-surface-variant)">System settings and configuration will be available here.</p>
        <div id="settings-content">
          <p style="color:var(--on-surface-variant);font-size:0.875rem">Loading settings...</p>
        </div>
      </div>
    </div>
  </main>
  <div data-include="/admin/components/admin-bottom-nav"></div>
  <div data-include="/auth-modal"></div>
  <script src="/js/components/include.js"></script>
  <script src="/js/shared/api.js"></script>
  <script src="/js/shared/dom.js"></script>
  <script src="/js/shared/auth.js"></script>
</body>
</html>
