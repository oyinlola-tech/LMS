<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Followers - LearnBridge</title>
  <link href="/css/styles.css" rel="stylesheet"/>
  <link href="/css/modal.css" rel="stylesheet"/>
</head>
<body>
  <div data-include="/components/dashboard-sidebar"></div>
  <main class="dashboard-main">
    <div data-include="/components/dashboard-header"></div>
    <div class="container" style="padding-top:1rem;padding-bottom:1rem">
      <h1 style="font-size:1.5rem;font-weight:700;margin-bottom:1.5rem">Followers</h1>
      <div class="search-box" style="margin-bottom:1rem">
        <input type="text" id="follower-search" placeholder="Search followers..." style="width:100%;padding:0.75rem 1rem;border-radius:0.5rem;border:1px solid var(--outline-variant);background:var(--surface);color:var(--on-surface);font-size:0.875rem"/>
      </div>
      <div id="followers-container" class="grid gap-3" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">
      </div>
      <div id="following-container" class="grid gap-3" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));margin-top:2rem">
      </div>
    </div>
  </main>
  <div data-include="/components/dashboard-bottom-nav"></div>
  <div data-include="/auth-modal"></div>
  <script src="/js/components/include.js"></script>
  <script src="/js/shared/api.js"></script>
  <script src="/js/shared/dom.js"></script>
  <script src="/js/shared/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await Shared.auth.requireAuth();
      const container = document.getElementById('followers-container');
      const followingContainer = document.getElementById('following-container');
      async function loadFollowers() {
        try {
          const res = await Shared.api.get(`/api/follow/${user.id}/followers`);
          const followers = res.data || [];
          container.innerHTML = followers.map(f => `
            <div class="card" style="padding:1rem;display:flex;align-items:center;gap:1rem">
              <div class="avatar" style="width:48px;height:48px;border-radius:50%;background:var(--primary-container);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--on-primary-container);background-image:url(${f.follower?.avatarUrl || ''});background-size:cover">${!f.follower?.avatarUrl ? (f.follower?.fullName?.[0] || '?') : ''}</div>
              <div style="flex:1">
                <p style="font-weight:600;font-size:0.875rem">${f.follower?.fullName || 'Unknown'}</p>
                <p style="font-size:0.75rem;color:var(--on-surface-variant)">${f.follower?.role || ''}</p>
              </div>
            </div>
          `).join('');
        } catch(e) { container.innerHTML = '<p>Failed to load followers</p>'; }
      }
      async function loadFollowing() {
        try {
          const res = await Shared.api.get(`/api/follow/${user.id}/following`);
          const following = res.data || [];
          followingContainer.innerHTML = '<h2 style="font-size:1.25rem;font-weight:600;margin-bottom:1rem;grid-column:1/-1">Following</h2>' +
            following.map(f => `
            <div class="card" style="padding:1rem;display:flex;align-items:center;gap:1rem">
              <div class="avatar" style="width:48px;height:48px;border-radius:50%;background:var(--primary-container);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--on-primary-container);background-image:url(${f.following?.avatarUrl || ''});background-size:cover">${!f.following?.avatarUrl ? (f.following?.fullName?.[0] || '?') : ''}</div>
              <div style="flex:1">
                <p style="font-weight:600;font-size:0.875rem">${f.following?.fullName || 'Unknown'}</p>
                <p style="font-size:0.75rem;color:var(--on-surface-variant)">${f.following?.role || ''}</p>
              </div>
              <button class="btn-secondary text-sm" onclick="unfollowUser('${f.followingId}')">Unfollow</button>
            </div>
          `).join('');
        } catch(e) { followingContainer.innerHTML = '<p>Failed to load following</p>'; }
      }
      window.unfollowUser = async (userId) => {
        try { await Shared.api.post(`/api/follow/${userId}/unfollow`); loadFollowing(); } catch(e) { alert('Failed to unfollow'); }
      };
      loadFollowers();
      loadFollowing();
    });
  </script>
</body>
</html>
