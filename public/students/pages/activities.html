<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>My Activities - LearnBridge</title>
  <link href="/css/styles.css" rel="stylesheet"/>
  <link href="/css/modal.css" rel="stylesheet"/>
</head>
<body>
  <div data-include="/components/dashboard-sidebar"></div>
  <main class="dashboard-main">
    <div data-include="/components/dashboard-header"></div>
    <div class="container" style="padding-top:1rem;padding-bottom:1rem;max-width:800px">
      <h1 style="font-size:1.5rem;font-weight:700;margin-bottom:1.5rem">My Activities</h1>
      <div id="stats-container" class="grid gap-4" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-bottom:2rem"></div>
      <h2 style="font-size:1.125rem;font-weight:600;margin-bottom:1rem">Recent Posts</h2>
      <div id="recent-posts"></div>
      <h2 style="font-size:1.125rem;font-weight:600;margin:1.5rem 0 1rem">Audit Log</h2>
      <div id="audit-log"></div>
    </div>
  </main>
  <div data-include="/components/dashboard-bottom-nav"></div>
  <div data-include="/auth-modal"></div>
  <script src="/js/components/include.js"></script>
  <script src="/js/shared/api.js"></script>
  <script src="/js/shared/dom.js"></script>
  <script src="/js/shared/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await Shared.auth.requireAuth();
      try {
        const res = await Shared.api.get(`/activities/user/${user.id}`);
        const data = res.data || {};
        const stats = data.stats || {};
        document.getElementById('stats-container').innerHTML = `
          <div class="card" style="padding:1rem;text-align:center"><p style="font-size:1.5rem;font-weight:700">${stats.postCount || 0}</p><p style="font-size:0.75rem;color:var(--on-surface-variant)">Posts</p></div>
          <div class="card" style="padding:1rem;text-align:center"><p style="font-size:1.5rem;font-weight:700">${stats.likeCount || 0}</p><p style="font-size:0.75rem;color:var(--on-surface-variant)">Likes</p></div>
          <div class="card" style="padding:1rem;text-align:center"><p style="font-size:1.5rem;font-weight:700">${stats.commentCount || 0}</p><p style="font-size:0.75rem;color:var(--on-surface-variant)">Comments</p></div>
          <div class="card" style="padding:1rem;text-align:center"><p style="font-size:1.5rem;font-weight:700">${stats.followingCount || 0}</p><p style="font-size:0.75rem;color:var(--on-surface-variant)">Following</p></div>
          <div class="card" style="padding:1rem;text-align:center"><p style="font-size:1.5rem;font-weight:700">${stats.followerCount || 0}</p><p style="font-size:0.75rem;color:var(--on-surface-variant)">Followers</p></div>
        `;
        const posts = data.recentPosts || [];
        document.getElementById('recent-posts').innerHTML = posts.length ? posts.map(p => `
          <div class="card" style="padding:1rem;margin-bottom:0.75rem">
            <p style="font-size:0.875rem">${p.body?.substring(0, 200)}${p.body?.length > 200 ? '...' : ''}</p>
            <p style="font-size:0.75rem;color:var(--on-surface-variant);margin-top:0.375rem">${new Date(p.createdAt).toLocaleDateString()}</p>
          </div>
        `).join('') : '<p style="color:var(--on-surface-variant)">No posts yet</p>';
        const logs = data.auditLogs || [];
        document.getElementById('audit-log').innerHTML = logs.length ? logs.map(l => `
          <div class="card" style="padding:0.75rem;margin-bottom:0.5rem;display:flex;justify-content:space-between;align-items:center">
            <div>
              <p style="font-weight:600;font-size:0.8125rem">${l.title}</p>
              <p style="font-size:0.75rem;color:var(--on-surface-variant)">${l.content}</p>
            </div>
            <span style="font-size:0.6875rem;color:var(--on-surface-variant)">${new Date(l.createdAt).toLocaleDateString()}</span>
          </div>
        `).join('') : '<p style="color:var(--on-surface-variant)">No audit logs</p>';
      } catch(e) { console.error(e); }
    });
  </script>
</body>
</html>
