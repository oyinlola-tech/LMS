<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>About - Portfolio</title><link href="/css/styles.css" rel="stylesheet"/><style>:root{--pf-primary:#1a56db;--pf-secondary:#374151;--pf-bg:#ffffff;--pf-surface:#f9fafb;--pf-text:#111827;--pf-accent:#3b82f6}*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}body{background:var(--pf-bg);color:var(--pf-text);padding:2rem}.container{max-width:800px;margin:0 auto}.pf-badge{display:inline-block;font-size:.75rem;font-weight:600;background:var(--pf-surface);border:1px solid #e5e7eb;padding:.25rem .75rem;border-radius:999px;margin-bottom:1rem}.pf-name{font-size:1.75rem;font-weight:800;margin-bottom:.5rem}.pf-headline{font-size:1rem;color:var(--pf-secondary);margin-bottom:1.5rem}.pf-section{margin-bottom:2rem}.pf-section h2{font-size:1.25rem;font-weight:700;margin-bottom:.75rem;color:var(--pf-primary)}.pf-bio{font-size:.9375rem;line-height:1.7;color:var(--pf-secondary)}.skills-wrap{display:flex;flex-wrap:wrap;gap:.5rem}.skill-badge{padding:.5rem 1rem;border-radius:999px;background:var(--pf-surface);border:1px solid #e5e7eb;font-size:.8125rem;font-weight:500}.social-links{display:flex;gap:.75rem;flex-wrap:wrap}.social-link{display:flex;align-items:center;gap:.375rem;padding:.5rem 1rem;border-radius:.75rem;background:var(--pf-surface);border:1px solid #e5e7eb;text-decoration:none;color:var(--pf-text);font-size:.8125rem;font-weight:500;transition:all .2s}.social-link:hover{border-color:var(--pf-accent);color:var(--pf-accent)}.loader{text-align:center;padding:3rem;color:var(--pf-secondary)}</style></head>
<body><div class="container" id="app"><div class="loader">Loading...</div></div>
<script src="/js/apis/api.js"></script>
<script>
(function(){
  var slug = new URLSearchParams(window.location.search).get('slug');
  if (!slug) { document.getElementById('app').innerHTML = '<p>No portfolio specified</p>'; return; }
  api.get('/portfolio/public?slug=' + slug).then(function(r) {
    if (!r.data){ document.getElementById('app').innerHTML = '<p>Portfolio not found</p>'; return; }
    var p = r.data.portfolio || {};
    var user = p.User || {};
    if (p.customColors){ var c=typeof p.customColors==='string'?JSON.parse(p.customColors):p.customColors; Object.entries(c).forEach(function(e){ document.documentElement.style.setProperty('--pf-'+e[0],e[1]) }); }
    var skills = p.skills ? (typeof p.skills === 'string' ? JSON.parse(p.skills) : p.skills) : [];
    var links = p.socialLinks ? (typeof p.socialLinks === 'string' ? JSON.parse(p.socialLinks) : p.socialLinks) : {};
    var html = '<div class="pf-badge">About</div><h1 class="pf-name">' + (user.fullName||'') + '</h1><p class="pf-headline">' + (p.headline||'') + '</p>';
    if (p.bio) html += '<div class="pf-section"><h2>Bio</h2><div class="pf-bio">' + p.bio + '</div></div>';
    if (skills.length) html += '<div class="pf-section"><h2>Skills</h2><div class="skills-wrap">' + skills.map(function(s){return '<span class="skill-badge">'+s+'</span>'}).join('') + '</div></div>';
    var hasLinks = Object.values(links).some(function(v){return v});
    if (hasLinks) html += '<div class="pf-section"><h2>Links</h2><div class="social-links">' + Object.entries(links).filter(function(e){return e[1]}).map(function(e){return '<a href="'+e[1]+'" target="_blank" class="social-link">'+e[0].charAt(0).toUpperCase()+e[0].slice(1)+'</a>'}).join('') + '</div></div>';
    document.getElementById('app').innerHTML = html;
  }).catch(function(){ document.getElementById('app').innerHTML = '<p>Failed to load portfolio</p>'; });
})();
</script></body></html>
