<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Maintenance - LearnBridge</title>
  <link href="/css/styles.css" rel="stylesheet"/>
  <link href="/css/workspace.css" rel="stylesheet"/>
</head>
<body>
  <main class="workspace-shell" style="display:grid;place-items:center;padding:2rem">
    <section class="workspace-panel workspace-section" style="max-width:760px">
      <p class="workspace-kicker">Maintenance</p>
      <h1 class="workspace-title" style="font-size:clamp(2rem,6vw,4.5rem)">We will be back soon.</h1>
      <p class="workspace-summary">LearnBridge is temporarily unavailable for maintenance.</p>
      <div class="workspace-actions" style="margin-top:1.5rem">
        <a class="btn-primary" href="/">Try again</a>
        <a class="btn-secondary" href="/support">Support</a>
      </div>
    </section>
  </main>
</body>
</html>
