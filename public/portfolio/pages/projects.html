<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Projects - Portfolio</title><link href="/css/styles.css" rel="stylesheet"/><style>:root{--pf-primary:#1a56db;--pf-secondary:#374151;--pf-bg:#ffffff;--pf-surface:#f9fafb;--pf-text:#111827;--pf-accent:#3b82f6}*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}body{background:var(--pf-bg);color:var(--pf-text);padding:2rem}.container{max-width:960px;margin:0 auto}.pf-badge{display:inline-block;font-size:.75rem;font-weight:600;background:var(--pf-surface);border:1px solid #e5e7eb;padding:.25rem .75rem;border-radius:999px;margin-bottom:1rem}h1{font-size:1.5rem;font-weight:800;margin-bottom:2rem}.projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.5rem}.project-card{border:1px solid #e5e7eb;border-radius:1rem;overflow:hidden;background:var(--pf-surface);transition:box-shadow .2s}.project-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.08)}.project-card .thumb{height:180px;background-size:cover;background-position:center;background-color:var(--pf-surface)}.project-card .body{padding:1.25rem}.project-card .body h3{font-size:1.0625rem;font-weight:700;margin-bottom:.25rem}.project-card .body .desc{font-size:.8125rem;color:var(--pf-secondary);line-height:1.5;margin-bottom:.75rem}.project-card .body .tags{display:flex;flex-wrap:wrap;gap:.375rem}.project-card .body .tags span{font-size:.6875rem;padding:.125rem .5rem;border-radius:999px;background:var(--pf-surface);border:1px solid #e5e7eb;color:var(--pf-secondary)}.loader{text-align:center;padding:3rem;color:var(--pf-secondary)}.empty{text-align:center;padding:3rem;color:var(--pf-secondary)}</style></head>
<body><div class="container" id="app"><div class="loader">Loading projects...</div></div>
<script src="/js/shared/api.js"></script>
<script>
(function(){
  var slug = new URLSearchParams(window.location.search).get('slug');
  if (!slug) { document.getElementById('app').innerHTML = '<p>No portfolio specified</p>'; return; }
  api.get('/portfolio/public?slug=' + slug).then(function(r) {
    if (!r.data){ document.getElementById('app').innerHTML = '<p>Portfolio not found</p>'; return; }
    var p = r.data.portfolio || {};
    var user = p.User || {};
    if (p.customColors){ var c=typeof p.customColors==='string'?JSON.parse(p.customColors):p.customColors; Object.entries(c).forEach(function(e){ document.documentElement.style.setProperty('--pf-'+e[0],e[1]) }); }

    var exp = p.experience ? (typeof p.experience === 'string' ? JSON.parse(p.experience) : p.experience) : [];
    var pages = r.data.pages || [];
    var projectImages = [];

    pages.forEach(function(pg) {
      var content = pg.content ? (typeof pg.content === 'string' ? JSON.parse(pg.content) : pg.content) : [];
      content.forEach(function(b) {
        if (b.type === 'image' && b.value) projectImages.push({ title: pg.title, src: b.value });
      });
    });

    var html = '<div class="pf-badge">Projects</div><h1>My Projects</h1>';

    var projectCards = [];

    exp.forEach(function(e) {
      if (e.image || e.role) {
        projectCards.push({
          image: e.image || '',
          title: e.role || '',
          desc: e.description || '',
          tags: e.company ? [e.company] : [],
        });
      }
    });

    projectImages.forEach(function(img) {
      projectCards.push({ image: img.src, title: img.title, desc: '', tags: [] });
    });

    projectCards = projectCards.filter(function(c) { return c.image || c.title; });

    if (projectCards.length) {
      html += '<div class="projects-grid">' + projectCards.map(function(c) {
        return '<div class="project-card">' +
          (c.image ? '<div class="thumb" style="background-image:url(' + c.image + ')"></div>' : '') +
          '<div class="body">' +
          (c.title ? '<h3>' + c.title + '</h3>' : '') +
          (c.desc ? '<div class="desc">' + c.desc + '</div>' : '') +
          (c.tags.length ? '<div class="tags">' + c.tags.map(function(t){return '<span>'+t+'</span>'}).join('') + '</div>' : '') +
          '</div></div>';
      }).join('') + '</div>';
    } else {
      html += '<div class="empty"><p>No projects added yet.</p></div>';
    }
    document.getElementById('app').innerHTML = html;
  }).catch(function(){ document.getElementById('app').innerHTML = '<p>Failed to load</p>'; });
})();
</script></body></html>
