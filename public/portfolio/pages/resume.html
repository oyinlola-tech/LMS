<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Resume / CV - Portfolio</title><link href="/css/styles.css" rel="stylesheet"/><style>:root{--pf-primary:#1a56db;--pf-secondary:#374151;--pf-bg:#ffffff;--pf-surface:#f9fafb;--pf-text:#111827;--pf-accent:#3b82f6}*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}body{background:var(--pf-bg);color:var(--pf-text);padding:2rem}.container{max-width:800px;margin:0 auto}.pf-badge{display:inline-block;font-size:.75rem;font-weight:600;background:var(--pf-surface);border:1px solid #e5e7eb;padding:.25rem .75rem;border-radius:999px;margin-bottom:1rem}.cv-header{display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap;margin-bottom:2rem}.cv-avatar{width:80px;height:80px;border-radius:50%;background-size:cover;background-position:center;background-color:var(--pf-surface);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;color:var(--pf-secondary);flex-shrink:0}.cv-name{font-size:1.75rem;font-weight:800}.cv-headline{font-size:1rem;color:var(--pf-secondary)}.cv-section{margin-bottom:2rem}.cv-section h2{font-size:1.125rem;font-weight:700;margin-bottom:1rem;color:var(--pf-primary);padding-bottom:.5rem;border-bottom:2px solid var(--pf-primary)}.cv-item{padding:1rem;border:1px solid #e5e7eb;border-radius:.75rem;margin-bottom:.75rem;background:var(--pf-surface)}.cv-item h3{font-size:.9375rem;font-weight:700}.cv-item .meta{font-size:.75rem;color:var(--pf-secondary);margin-top:.125rem}.cv-item p{font-size:.8125rem;color:var(--pf-secondary);margin-top:.375rem;line-height:1.5}.skills-wrap{display:flex;flex-wrap:wrap;gap:.5rem}.skill-badge{padding:.375rem .75rem;border-radius:999px;background:var(--pf-surface);border:1px solid #e5e7eb;font-size:.8125rem;font-weight:500}.btn-download{display:inline-flex;align-items:center;gap:.5rem;padding:.75rem 1.5rem;background:var(--pf-primary);color:#fff;border:none;border-radius:.75rem;font-size:.9375rem;font-weight:700;cursor:pointer;text-decoration:none;font-family:inherit;transition:opacity .2s}.btn-download:hover{opacity:.9}.cv-actions{display:flex;gap:1rem;margin-bottom:2rem;flex-wrap:wrap}.loader{text-align:center;padding:3rem;color:var(--pf-secondary)}</style></head>
<body><div class="container" id="app"><div class="loader">Loading resume...</div></div>
<script src="/js/apis/api.js"></script>
<script>
(function(){
  var slug = new URLSearchParams(window.location.search).get('slug');
  if (!slug) { document.getElementById('app').innerHTML = '<p>No portfolio specified</p>'; return; }
  api.get('/portfolio/public?slug=' + slug).then(function(r) {
    if (!r.data){ document.getElementById('app').innerHTML = '<p>Portfolio not found</p>'; return; }
    var p = r.data.portfolio || {};
    var user = p.User || {};
    if (p.customColors){ var c=typeof p.customColors==='string'?JSON.parse(p.customColors):p.customColors; Object.entries(c).forEach(function(e){ document.documentElement.style.setProperty('--pf-'+e[0],e[1]) }); }

    var skills = p.skills ? (typeof p.skills === 'string' ? JSON.parse(p.skills) : p.skills) : [];
    var exp = p.experience ? (typeof p.experience === 'string' ? JSON.parse(p.experience) : p.experience) : [];
    var edu = p.education ? (typeof p.education === 'string' ? JSON.parse(p.education) : p.education) : [];
    var certs = p.certifications ? (typeof p.certifications === 'string' ? JSON.parse(p.certifications) : p.certifications) : [];
    var links = p.socialLinks ? (typeof p.socialLinks === 'string' ? JSON.parse(p.socialLinks) : p.socialLinks) : {};

    function esc(s){return typeof s==='string'?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):'';}

    var html = '<div class="pf-badge">Resume / CV</div>';
    html += '<div class="cv-actions"><a class="btn-download" href="/portfolio/cv?slug=' + slug + '" target="_blank"><span class="material-symbols-outlined" style="font-size:1.25rem">download</span> Download CV (PDF)</a></div>';
    html += '<div class="cv-header"><div class="cv-avatar" style="'+(user.avatarUrl?'background-image:url('+user.avatarUrl+')':'')+'">'+(user.avatarUrl?'':(user.fullName||'?').charAt(0).toUpperCase())+'</div><div><h1 class="cv-name">'+esc(user.fullName||'')+'</h1><p class="cv-headline">'+esc(p.headline||'')+'</p></div></div>';
    if (p.bio) html += '<div class="cv-section"><h2>Professional Summary</h2><p style="font-size:.875rem;line-height:1.6;color:var(--pf-secondary)">'+esc(p.bio)+'</p></div>';
    if (skills.length) html += '<div class="cv-section"><h2>Skills</h2><div class="skills-wrap">'+skills.map(function(s){return '<span class="skill-badge">'+esc(s)+'</span>'}).join('')+'</div></div>';
    if (exp.length) html += '<div class="cv-section"><h2>Experience</h2>'+exp.map(function(e){return '<div class="cv-item"><h3>'+esc(e.role||'')+'</h3><div class="meta">'+[e.company,e.duration].filter(Boolean).join(' &middot; ')+'</div>'+(e.description?'<p>'+esc(e.description)+'</p>':'')+'</div>'}).join('')+'</div>';
    if (edu.length) html += '<div class="cv-section"><h2>Education</h2>'+edu.map(function(e){return '<div class="cv-item"><h3>'+esc(e.degree||'')+'</h3><div class="meta">'+[e.school,e.graduationYear].filter(Boolean).join(' &middot; ')+'</div></div>'}).join('')+'</div>';
    if (certs.length) html += '<div class="cv-section"><h2>Certifications</h2>'+certs.map(function(c){return '<div class="cv-item"><h3>'+esc(c.name||'')+'</h3><div class="meta">'+[c.issuer,c.year].filter(Boolean).join(' &middot; ')+'</div></div>'}).join('')+'</div>';
    var hasLinks = Object.values(links).some(function(v){return v});
    if (hasLinks) html += '<div class="cv-section"><h2>Links</h2><div style="display:flex;gap:.75rem;flex-wrap:wrap">'+Object.entries(links).filter(function(e){return e[1]}).map(function(e){return '<a href="'+e[1]+'" target="_blank" style="font-size:.8125rem;color:var(--pf-accent);text-decoration:none">'+e[0].charAt(0).toUpperCase()+e[0].slice(1)+'</a>'}).join('')+'</div></div>';

    document.getElementById('app').innerHTML = html;
  }).catch(function(){ document.getElementById('app').innerHTML = '<p>Failed to load</p>'; });
})();
</script></body></html>
