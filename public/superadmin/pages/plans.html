<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>LearnBridge - Portfolio Plans</title>
  <link href="/css/styles.css" rel="stylesheet"/>
  <link href="/css/modal.css" rel="stylesheet"/>
  <style>
    body { background: var(--surface); }
    .admin-layout { display: flex; min-height: 100vh; }
    .admin-main { flex: 1; padding: 2rem; overflow-y: auto; }
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
    .page-header h1 { font-size: 1.5rem; font-weight: 700; }
    .page-header p { font-size: 0.875rem; color: var(--on-surface-variant); margin-top: 0.25rem; }
    .plans-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem; }
    .plan-card { background: var(--surface-container); border: 1px solid var(--outline-variant); border-radius: 1rem; padding: 1.5rem; position: relative; transition: var(--transition); }
    .plan-card.inactive { opacity: 0.6; }
    .plan-card h2 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.25rem; }
    .plan-price { font-size: 2rem; font-weight: 800; color: var(--primary); margin: 0.75rem 0; }
    .plan-price span { font-size: 1rem; font-weight: 500; color: var(--on-surface-variant); }
    .plan-currency { font-size: 0.8125rem; color: var(--on-surface-variant); }
    .plan-features { margin: 1rem 0; padding: 0; list-style: none; }
    .plan-features li { display: flex; align-items: center; gap: 0.5rem; padding: 0.375rem 0; font-size: 0.8125rem; color: var(--on-surface); }
    .plan-features li .check { color: #10b981; }
    .plan-actions { display: flex; gap: 0.5rem; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--outline-variant); }
    .plan-badge { display: inline-block; font-size: 0.6875rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.25rem 0.5rem; border-radius: 0.375rem; background: var(--primary-container); color: var(--on-primary-container); }
    .plan-badge.inactive-badge { background: var(--surface-container-high); color: var(--on-surface-variant); }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; display: none; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal-content { background: var(--surface-container); border-radius: 1rem; padding: 2rem; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; margin: 1rem; }
    .modal-content h2 { font-size: 1.25rem; font-weight: 700; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.8125rem; font-weight: 600; margin-bottom: 0.375rem; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 0.625rem 0.75rem; border: 1px solid var(--outline-variant); border-radius: 0.75rem; background: var(--surface-container-lowest); color: var(--on-surface); font-size: 0.875rem; font-family: inherit; outline: none; box-sizing: border-box; }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--primary); }
    .form-group textarea { min-height: 100px; resize: vertical; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-actions { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem; }
    .feature-tag { display: inline-flex; align-items: center; gap: 0.375rem; background: var(--surface-container-high); border-radius: 0.5rem; padding: 0.375rem 0.625rem; font-size: 0.8125rem; margin: 0.25rem; }
    .feature-tag .remove { cursor: pointer; color: var(--error); font-weight: 700; font-size: 1rem; line-height: 1; }
    @media (max-width: 768px) { .admin-main { padding: 1rem; } }
  </style>
</head>
<body>
  <div class="admin-layout">
    <main class="admin-main">
      <div class="page-header">
        <div>
          <h1>Portfolio Plans</h1>
          <p>Manage portfolio subscription plans and pricing</p>
        </div>
        <button class="btn-primary" onclick="openModal()"><span class="material-symbols-outlined" style="font-size:1.125rem">add</span> New Plan</button>
      </div>
      <div class="plans-grid" id="plans-grid">
        <div class="skeleton" style="height:240px;border-radius:1rem"></div>
        <div class="skeleton" style="height:240px;border-radius:1rem"></div>
        <div class="skeleton" style="height:240px;border-radius:1rem"></div>
      </div>
    </main>
  </div>
  <div data-include="/superadmin/components/superadmin-bottom-nav"></div>
  <div data-include="auth-modal"></div>
  <div id="toast" class="toast" style="position:fixed;bottom:2rem;right:2rem;background:var(--on-surface);color:var(--surface);padding:0.75rem 1.25rem;border-radius:0.75rem;font-size:0.875rem;z-index:200;opacity:0;transform:translateY(1rem);transition:all 0.3s"></div>

  <div class="modal-overlay" id="plan-modal">
    <div class="modal-content">
      <h2 id="modal-title">New Plan</h2>
      <input type="hidden" id="plan-id"/>
      <div class="form-group">
        <label>Plan Name</label>
        <input type="text" id="plan-name" placeholder="e.g. Pro"/>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Slug</label>
          <input type="text" id="plan-slug" placeholder="e.g. pro"/>
        </div>
        <div class="form-group">
          <label>Currency</label>
          <select id="plan-currency">
            <option value="USD">USD</option>
            <option value="NGN">NGN</option>
            <option value="EUR">EUR</option>
            <option value="GBP">GBP</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Price</label>
          <input type="number" id="plan-price" placeholder="0.00" step="0.01" min="0"/>
        </div>
        <div class="form-group">
          <label>Active</label>
          <select id="plan-active">
            <option value="true">Yes</option>
            <option value="false">No</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Features (one per line)</label>
        <textarea id="plan-features" placeholder="Unlimited themes&#10;Custom domain&#10;CV export"></textarea>
      </div>
      <div class="form-actions">
        <button class="btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn-primary" onclick="savePlan()">Save Plan</button>
      </div>
    </div>
  </div>

  <script src="/js/components/include.js"></script>
  <script src="/js/shared/api.js"></script>
  <script src="/js/apis/auth.js"></script>
  <script src="/js/components/auth-modal.js"></script>
  <script>
    (function() {
      if (!localStorage.getItem('token')) { window.location.href = '/login'; return; }
      var toastTimer;

      window.showToast = function(m) {
        var t = document.getElementById('toast');
        t.textContent = m; t.style.opacity = '1'; t.style.transform = 'translateY(0)';
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function(){ t.style.opacity = '0'; t.style.transform = 'translateY(1rem)'; }, 3000);
      };

      window.openModal = function(plan) {
        document.getElementById('plan-modal').classList.add('open');
        if (plan) {
          document.getElementById('modal-title').textContent = 'Edit Plan';
          document.getElementById('plan-id').value = plan.id;
          document.getElementById('plan-name').value = plan.name || '';
          document.getElementById('plan-slug').value = plan.slug || '';
          document.getElementById('plan-currency').value = plan.currency || 'USD';
          document.getElementById('plan-price').value = plan.price || 0;
          document.getElementById('plan-active').value = plan.isActive ? 'true' : 'false';
          var features = plan.features;
          if (typeof features === 'string') { try { features = JSON.parse(features); } catch(e) {} }
          document.getElementById('plan-features').value = Array.isArray(features) ? features.join('\n') : (features || '');
        } else {
          document.getElementById('modal-title').textContent = 'New Plan';
          document.getElementById('plan-id').value = '';
          document.getElementById('plan-name').value = '';
          document.getElementById('plan-slug').value = '';
          document.getElementById('plan-currency').value = 'USD';
          document.getElementById('plan-price').value = '';
          document.getElementById('plan-active').value = 'true';
          document.getElementById('plan-features').value = '';
        }
      };

      window.closeModal = function() {
        document.getElementById('plan-modal').classList.remove('open');
      };

      document.getElementById('plan-modal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
      });

      window.savePlan = async function() {
        var id = document.getElementById('plan-id').value;
        var name = document.getElementById('plan-name').value.trim();
        var slug = document.getElementById('plan-slug').value.trim();
        var currency = document.getElementById('plan-currency').value;
        var price = parseFloat(document.getElementById('plan-price').value) || 0;
        var isActive = document.getElementById('plan-active').value === 'true';
        var featuresRaw = document.getElementById('plan-features').value.trim();
        var features = featuresRaw ? featuresRaw.split('\n').map(function(f){return f.trim()}).filter(Boolean) : [];

        if (!name || !slug) { showToast('Name and slug are required'); return; }

        try {
          var body = { name, slug, currency, price, isActive, features: features.length ? JSON.stringify(features) : null };
          if (id) {
            await api.put('/portfolio/admin/plans/' + id, body);
            showToast('Plan updated');
          } else {
            await api.post('/portfolio/admin/plans', body);
            showToast('Plan created');
          }
          closeModal();
          loadPlans();
        } catch(e) {
          showToast(e.data?.error?.message || 'Failed to save plan');
        }
      };

      async function loadPlans() {
        try {
          var res = await api.get('/portfolio/admin/plans');
          var plans = res.data || [];
          var grid = document.getElementById('plans-grid');
          if (!plans.length) {
            grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--on-surface-variant)">No plans yet. Create your first plan.</div>';
            return;
          }
          grid.innerHTML = plans.map(function(p) {
            var feat = p.features;
            if (typeof feat === 'string') { try { feat = JSON.parse(feat); } catch(e) { feat = []; } }
            var featuresList = Array.isArray(feat) ? feat : [];
            var isInactive = !p.isActive;
            return '<div class="plan-card' + (isInactive ? ' inactive' : '') + '">' +
              '<div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.25rem">' +
                '<h2>' + escapeHtml(p.name) + '</h2>' +
                (isInactive ? '<span class="plan-badge inactive-badge">Inactive</span>' : '<span class="plan-badge">Active</span>') +
              '</div>' +
              '<div class="plan-price">' + (p.price > 0 ? '$' + Number(p.price).toFixed(2) : 'Free') + '<span>' + (p.price > 0 ? ' /month' : '') + '</span></div>' +
              '<div class="plan-currency">' + p.currency + (p.slug ? ' &middot; slug: ' + escapeHtml(p.slug) : '') + '</div>' +
              (featuresList.length ? '<ul class="plan-features">' + featuresList.map(function(f){ return '<li><span class="check material-symbols-outlined" style="font-size:1rem">check_circle</span>' + escapeHtml(f) + '</li>'; }).join('') + '</ul>' : '') +
              '<div class="plan-actions">' +
                '<button class="btn-secondary" style="flex:1;justify-content:center" onclick="openModal(' + JSON.stringify(p).replace(/"/g, '&quot;') + ')"><span class="material-symbols-outlined" style="font-size:1rem">edit</span> Edit</button>' +
              '</div>' +
            '</div>';
          }).join('');
        } catch(e) {
          document.getElementById('plans-grid').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--error)">Failed to load plans</div>';
        }
      }

      function escapeHtml(s) {
        if (typeof s !== 'string') return '';
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }

      document.addEventListener('components-loaded', loadPlans);
    })();
  </script>
</body>
</html>
