<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Activities - Super Admin | LearnBridge</title>
  <link href="/css/styles.css" rel="stylesheet"/>
  <link href="/css/modal.css" rel="stylesheet"/>
</head>
<body>
  <div data-include="/superadmin/components/superadmin-sidebar"></div>
  <main class="admin-main">
    <div data-include="/superadmin/components/superadmin-header"></div>
    <div class="container" style="padding-top:1rem;padding-bottom:1rem">
      <h1 style="font-size:1.5rem;font-weight:700;margin-bottom:1.5rem">Platform Activities</h1>
      <div id="activities-list"></div>
    </div>
  </main>
  <div data-include="/superadmin/components/superadmin-bottom-nav"></div>
  <div data-include="/auth-modal"></div>
  <script src="/js/components/include.js"></script>
  <script src="/js/shared/api.js"></script>
  <script src="/js/shared/dom.js"></script>
  <script src="/js/shared/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await Shared.auth.requireAuth();
      try {
        const res = await Shared.api.get('/activities/admin?limit=100');
        const items = res.data?.items || [];
        document.getElementById('activities-list').innerHTML = items.map(l => `
          <div class="card" style="padding:0.75rem;margin-bottom:0.5rem">
            <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.25rem">
              <span class="badge" style="font-size:0.6875rem;padding:0.125rem 0.375rem">${l.status}</span>
              <p style="font-weight:600;font-size:0.8125rem">${l.title}</p>
              <span style="margin-left:auto;font-size:0.6875rem;color:var(--on-surface-variant)">${new Date(l.createdAt).toLocaleString()}</span>
            </div>
            <p style="font-size:0.75rem;color:var(--on-surface-variant)">${l.content}</p>
            <p style="font-size:0.6875rem;color:var(--on-surface-variant);margin-top:0.125rem">by ${l.actor?.fullName || 'System'}</p>
          </div>
        `).join('');
      } catch(e) { console.error(e); }
    });
  </script>
</body>
</html>
