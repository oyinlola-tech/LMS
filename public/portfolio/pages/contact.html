<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Contact - Portfolio</title><link href="/css/styles.css" rel="stylesheet"/><style>:root{--pf-primary:#1a56db;--pf-secondary:#374151;--pf-bg:#ffffff;--pf-surface:#f9fafb;--pf-text:#111827;--pf-accent:#3b82f6}*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}body{background:var(--pf-bg);color:var(--pf-text);padding:2rem}.container{max-width:640px;margin:0 auto}.pf-badge{display:inline-block;font-size:.75rem;font-weight:600;background:var(--pf-surface);border:1px solid #e5e7eb;padding:.25rem .75rem;border-radius:999px;margin-bottom:1rem}h1{font-size:1.5rem;font-weight:800;margin-bottom:.5rem}.sub{color:var(--pf-secondary);font-size:.875rem;margin-bottom:2rem}.form-group{margin-bottom:1rem}.form-group label{display:block;font-size:.8125rem;font-weight:600;margin-bottom:.375rem}.form-group input,.form-group textarea{width:100%;padding:.75rem 1rem;border:1px solid #e5e7eb;border-radius:.75rem;font-size:.875rem;font-family:inherit;outline:none;background:var(--pf-surface)}.form-group input:focus,.form-group textarea:focus{border-color:var(--pf-accent)}.form-group textarea{min-height:120px;resize:vertical}button{padding:.75rem 2rem;background:var(--pf-primary);color:#fff;border:none;border-radius:.75rem;font-size:.9375rem;font-weight:700;cursor:pointer;font-family:inherit}button:disabled{opacity:.5}.status{font-size:.8125rem;margin-top:.75rem}.loader{text-align:center;padding:3rem;color:var(--pf-secondary)}</style></head>
<body><div class="container" id="app"><div class="loader">Loading...</div></div>
<script src="/js/shared/api.js"></script>
<script>
(function(){
  var slug = new URLSearchParams(window.location.search).get('slug');
  if (!slug) { document.getElementById('app').innerHTML = '<p>No portfolio specified</p>'; return; }
  api.get('/portfolio/public?slug=' + slug).then(function(r) {
    if (!r.data){ document.getElementById('app').innerHTML = '<p>Portfolio not found</p>'; return; }
    var p = r.data.portfolio || {};
    if (p.customColors){ var c=typeof p.customColors==='string'?JSON.parse(p.customColors):p.customColors; Object.entries(c).forEach(function(e){ document.documentElement.style.setProperty('--pf-'+e[0],e[1]) }); }
    var html = '<div class="pf-badge">Contact</div><h1>Get In Touch</h1><p class="sub">Send me a message and I\'ll get back to you</p>';
    html += '<div class="form-group"><label>Your Name</label><input type="text" id="c-name" placeholder="John Doe"/></div>';
    html += '<div class="form-group"><label>Your Email</label><input type="email" id="c-email" placeholder="john@example.com"/></div>';
    html += '<div class="form-group"><label>Message</label><textarea id="c-message" placeholder="Your message..."></textarea></div>';
    html += '<button onclick="sendMsg()">Send Message</button><div class="status" id="c-status"></div>';
    document.getElementById('app').innerHTML = html;
  }).catch(function(){ document.getElementById('app').innerHTML = '<p>Failed to load</p>'; });

  window.sendMsg = function() {
    var name = document.getElementById('c-name').value;
    var email = document.getElementById('c-email').value;
    var message = document.getElementById('c-message').value;
    if (!name || !email || !message) { document.getElementById('c-status').textContent = 'All fields required'; return; }
    api.post('/portfolio/contact', { slug: slug, name: name, email: email, message: message }).then(function() {
      document.getElementById('c-status').innerHTML = 'Message sent! A copy has been sent to your email.';
      document.getElementById('c-status').style.color = '#16a34a';
      document.getElementById('c-name').value = '';
      document.getElementById('c-email').value = '';
      document.getElementById('c-message').value = '';
    }).catch(function() { document.getElementById('c-status').textContent = 'Failed to send'; document.getElementById('c-status').style.color = '#dc2626'; });
  };
})();
</script></body></html>
